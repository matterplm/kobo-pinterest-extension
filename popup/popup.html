<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kōbō Inspiration</title>
  <link rel="stylesheet" href="../lib/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="../assets/icons/icon-32.png" alt="" width="22" height="22">
        <div>
          <h1>Kōbō</h1>
          <span class="brand-sub">Inspiration</span>
        </div>
      </div>
      <button id="settingsBtn" class="icon-btn" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- ------------------------------------------------------- signed out -->
    <section id="loginView" class="view hidden">
      <div class="intro">
        <h2>Sign in to Kōbō</h2>
        <p>Pin images from anywhere on the web straight into your inspiration boards.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input id="email" class="custom-input" type="email" autocomplete="username" required placeholder="you@brand.com">
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input id="password" class="custom-input" type="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <div id="loginError" class="form-error hidden"></div>
        <button id="loginBtn" class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <div class="intro-links">
        <a id="forgotLink" href="#">Forgot password</a>
        <span aria-hidden="true">·</span>
        <a id="registerLink" href="#">Create an account</a>
      </div>
      <div id="envNotice" class="env-notice hidden"></div>
    </section>

    <!-- -------------------------------------------------------- signed in -->
    <section id="mainView" class="view hidden">
      <div class="account">
        <div class="avatar" id="userInitial">K</div>
        <div class="account-meta">
          <div class="account-name" id="userName"></div>
          <div class="account-sub" id="userCompany"></div>
        </div>
        <button id="signOutBtn" class="inline-link" type="button">Sign out</button>
      </div>

      <div id="brandRow" class="field hidden">
        <label class="field-label" for="brandSelect">Pinning into brand</label>
        <select id="brandSelect" class="custom-select"></select>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="savedToday">0</span>
          <span class="stat-label">Saved today</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="totalPins">0</span>
          <span class="stat-label">Total pins</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="totalBoards">0</span>
          <span class="stat-label">Boards</span>
        </div>
      </div>

      <div class="actions">
        <button id="pinPageBtn" class="action" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
          <span>Pin this page</span>
        </button>
        <button id="captureBtn" class="action" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
          <span>Capture area</span>
        </button>
      </div>

      <div class="section">
        <div class="section-head">
          <h3>Your boards</h3>
          <button id="openAppBtn" class="inline-link" type="button">Open in Kōbō</button>
        </div>
        <div id="boardList" class="board-list">
          <div class="empty">Loading your boards…</div>
        </div>
      </div>
    </section>

    <div id="toast" class="toast"></div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
